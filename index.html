<style>

<style>
/* layout: one narrow column read top to bottom. people line, bus stop bays, parking-lot jam */
:root{
  --bg:#dde5ea; --panel:#f5f8fa; --ink:#17252e; --muted:#566974; --line:#c3ced6;
  --track:#dde6ec; --road:#3d4952; --slot:#b4c0c8; --lot:#cbd5dc;
  --accent:#0d6b85; --accent-ink:#ffffff;
  --led-bg:#16110a; --led:#ffb319; --led-dim:#a87720; --scrim:rgba(18,28,35,.62); --star:#b07800;
  --f-led:"DotGothic16","Osaka-Mono","MS Gothic",monospace;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181e; --panel:#1a252d; --ink:#e6edf1; --muted:#8fa1ac; --line:#2c3a44;
    --track:#25333c; --road:#0a0f13; --slot:#56646e; --lot:#1e2a32;
    --accent:#3aa9c4; --accent-ink:#06222b; --scrim:rgba(4,8,11,.72); --star:#f5c542; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10181e; --panel:#1a252d; --ink:#e6edf1; --muted:#8fa1ac; --line:#2c3a44;
  --track:#25333c; --road:#0a0f13; --slot:#56646e; --lot:#1e2a32;
  --accent:#3aa9c4; --accent-ink:#06222b; --scrim:rgba(4,8,11,.72); --star:#f5c542; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{max-width:440px;margin-inline:auto;padding-inline:16px;padding-block:12px 18px;
  display:flex;flex-direction:column;gap:10px}

.sign{display:flex;gap:8px;align-items:stretch}
.led{flex:1;min-width:0;background:var(--led-bg);border-radius:8px;padding:7px 12px 8px;
  font-family:var(--f-led);color:var(--led);border:2px solid #000;
  background-image:radial-gradient(rgba(255,179,25,.09) 1px,transparent 1.4px);background-size:4px 4px}
.led-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#route{font-size:24px;line-height:1.1;letter-spacing:.04em}
#left{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
#msg{font-size:14px;line-height:1.35;color:var(--led-dim);margin-top:3px;min-height:1.35em}
#msg.hot{color:var(--led)}
.nav{width:40px;border:0;border-radius:8px;background:var(--panel);font-size:22px;font-weight:800;
  cursor:pointer;box-shadow:0 2px 0 var(--line)}
.nav:disabled{opacity:.35;cursor:default}

.stage{position:relative}
canvas{display:block;width:100%;aspect-ratio:360/532;touch-action:manipulation;cursor:pointer;border-radius:12px}

.ctl{display:flex;gap:6px}
.btn{flex:1;border:0;border-radius:12px;padding:11px 4px;font-weight:800;font-size:13px;cursor:pointer;min-width:0;
  background:var(--panel);box-shadow:0 3px 0 var(--line);white-space:nowrap}
.btn.go{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){translate:0 2px;box-shadow:none}
.btn:focus-visible,.nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.snd{flex:none;width:42px;font-size:17px;padding-block:8px}
.btn.snd[aria-pressed="false"]{text-decoration:line-through;color:var(--muted)}
.btn small{font-weight:500;font-variant-numeric:tabular-nums;opacity:.8;margin-left:3px}

.dialog{position:absolute;inset:0;background:var(--scrim);border-radius:12px;display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--panel);border-radius:16px;padding:20px 18px 16px;width:min(100%,310px);
  display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{margin:0;font-family:var(--f-led);font-weight:400;font-size:24px;line-height:1.2;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.card ol{margin:0;padding-left:1.4em;text-align:left;font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.card ol b{color:var(--accent);font-weight:800}
.card .acts{display:flex;flex-direction:column;gap:8px}
.card p b{color:var(--ink);font-variant-numeric:tabular-nums}
.card .stars{font-size:30px;letter-spacing:.14em;color:var(--star);line-height:1}
.card .note{font-size:12px}
.card.wide{width:100%;padding:16px 12px 12px}
.tiles{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-height:262px;overflow-y:auto;padding:2px}
.tile{border:0;border-radius:10px;background:var(--bg);color:var(--ink);padding:6px 2px 4px;display:flex;flex-direction:column;
  align-items:center;gap:1px;cursor:pointer;min-width:0;font:inherit}
.tile b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:10px;color:var(--muted);white-space:nowrap}
.tile.done span{color:var(--star)}
.tile small{font-size:10px;color:var(--muted);min-height:1.3em;font-variant-numeric:tabular-nums}
.tile.here{outline:2px solid var(--accent);outline-offset:-2px}
.tile:disabled{opacity:.4;cursor:default}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
</style>
</head>

<main class="app">
  <header class="sign">
    <button class="nav" id="prev" aria-label="前のレベルへ">‹</button>
    <div class="led">
      <div class="led-top"><span id="route">レベル 1</span><span id="left"></span></div>
      <div id="msg" aria-live="polite"></div>
    </div>
    <button class="nav" id="next" aria-label="次のレベルへ">›</button>
  </header>

  <div class="stage">
    <canvas id="cv" role="img" aria-label="ゲーム画面。上に人の列、まん中にのりば、下に駐車場"></canvas>
    <div class="dialog" id="dialog" hidden></div>
  </div>

  <footer class="ctl">
    <button class="btn" id="hint">ヒント</button>
    <button class="btn" id="undo">もどす<small id="undoN">×3</small></button>
    <button class="btn" id="retry">最初から</button>
    <button class="btn" id="menu">メニュー</button>
    <button class="btn snd" id="snd" aria-pressed="true" aria-label="効果音">♪</button>
  </footer>
</main>

const KEY="busnoriba.v3";

function clean(s){
  const o={max:Math.max(1,(s&&s.max)|0),cur:Math.max(1,(s&&s.cur)|0),help:!!(s&&s.help),snd:!(s&&s.snd===false),sk:[],rec:{}},r=s&&s.rec;
  if(r&&typeof r==="object")for(const k in r){const v=r[k];if(Array.isArray(v)&&(k|0)>0)o.rec[k|0]=[Math.max(1,v[0]|0),Math.max(0,v[1]|0),Math.max(0,v[2]|0)];}
  if(s&&Array.isArray(s.sk))for(const v of s.sk){const k=v|0;if(k>0&&!o.sk.includes(k))o.sk.push(k);}
  o.sk.sort((a,b)=>a-b);
  for(const k of o.sk)if(k>=o.max)o.max=k+1;
  for(const k in o.rec)if(+k>=o.max)o.max=+k+1;

function readLocal(){try{return clean(JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){return clean(null);}}

    S.rec[k]=a?[Math.max(a[0],b[0]),Math.min(a[1],b[1]),a[2]&&b[2]?Math.min(a[2],b[2]):(a[2]||b[2])]:b;}

let AC=null,master=null,primed=false;
function audio(){
  if(!S.snd)return null;

// One bouncy game-console style blip: a square wave rounded off with a triangle and a low-pass filter.
// "scoop" starts the note slightly flat and snaps up (the bounce), "slide" bends it by the end, "hold" is how
// much of the note stays at full level before it fades. Everything is in C major pentatonic so overlaps never clash.
function chip(f,delay,dur,vol,o){
  const a=audio();if(!a)return;o=o||{};
  try{
    const t=a.currentTime+(delay||0),g=a.createGain(),lp=a.createBiquadFilter();
    lp.type="lowpass";lp.frequency.value=o.cut||Math.min(5200,Math.max(1400,f*3.2));lp.Q.value=.7;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.004);
    g.gain.setValueAtTime(vol,t+dur*(o.hold==null?.3:o.hold));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    lp.connect(g);g.connect(master);
    for(const w of o.wave?[[o.wave,1]]:[["square",.5],["triangle",.85]]){
      const os=a.createOscillator(),og=a.createGain();os.type=w[0];og.gain.value=w[1];
      os.frequency.setValueAtTime(f*(o.scoop||1),t);
      if(o.scoop)os.frequency.exponentialRampToValueAtTime(f,t+.02);
      if(o.slide)os.frequency.exponentialRampToValueAtTime(f*o.slide,t+dur);
      os.connect(og);og.connect(lp);os.start(t);os.stop(t+dur+.04);
    }
  }catch(e){}
}
const NOTE={E4:330,A4:440,C5:523,D5:587,E5:659,G5:784,A5:880,C6:1047,E6:1319,G6:1568,C7:2093};

const SFX={
  go(){[NOTE.E6,NOTE.C6,NOTE.E6,NOTE.C6,NOTE.G6].forEach((n,i)=>chip(n,i*.048,i===4?.14:.07,.05,{scoop:.92,hold:.1}));},   // rolling "ko-ro-ko-ro-pon"
  bump(){chip(330,0,.13,.075,{wave:"triangle",slide:.5,cut:1200});chip(247,.11,.1,.055,{wave:"triangle",slide:.7,cut:1200});},  // blocked: springy "boyon"
  full(){chip(NOTE.E4,0,.08,.06,{cut:900,hold:.7});chip(NOTE.E4,.11,.13,.06,{cut:900,hold:.7});},                             // no free bay: soft "bu-bu"

  depart(){chip(NOTE.E6,0,.06,.05,{hold:.6});chip(NOTE.G6,.055,.06,.05,{hold:.6});chip(NOTE.C7,.11,.4,.05,{hold:.2});},        // full bus leaves: "pi-ro-rin"
  win(){[NOTE.G5,NOTE.C6,NOTE.E6,NOTE.G6,NOTE.C7].forEach((n,i)=>chip(n,.18+i*.07,.09,.05,{scoop:.94,hold:.5}));

function probe(b){

      const me=corners(b.x+c*d,b.y+s*d,b.a,b.len/2,b.w/2-.5);

    }

function snap(){return{qi:G.qi,seq:G.seq,bay:G.bay.slice(),b:G.buses.map(b=>{
  let st=b.state;if(st==="bump")st="lot";else if(st==="exit"||st==="arrive")st="parked";else if(st==="leave")st="gone";

// Exact search from the position on screen: the buses to tap, in order, so the level can still be cleared.
// Returns the list, false if this position can no longer be cleared, or null if it ran out of thinking time.
function solveFrom(cap){
  const m=G.buses.length,q=G.queue,n=q.length,blk=G.blk,memo=new Set(),path=[];let nodes=0;
  const lot0=G.buses.map(b=>b.state==="lot"||b.state==="bump"?1:0);
  const park0=G.buses.filter(b=>b.slot>=0&&b.rem>0&&(b.state==="exit"||b.state==="arrive"||b.state==="parked"))
    .sort((a,b)=>a.order-b.order).map(b=>[b.color,b.rem]);
  function go(lot,parked,qi){
    for(;qi<n;){const c=q[qi];let b=null;for(const p of parked)if(p[0]===c&&p[1]>0){b=p;break;}if(!b)break;b[1]--;qi++;if(!b[1])parked.splice(parked.indexOf(b),1);}
    if(qi>=n)return true;
    if(parked.length>=G.slots)return false;
    const key=lot.join("")+"|"+parked.map(p=>p[0]+":"+p[1]).join(",");if(memo.has(key))return false;memo.add(key);
    if(++nodes>cap)throw 0;
    const c=q[qi],mv=[];for(let i=0;i<m;i++)if(lot[i]&&blk[i].every(j=>!lot[j]))mv.push(i);
    const soon=new Map();for(const i of mv){const cc=G.buses[i].color;if(!soon.has(cc)){let k=qi;while(k<n&&q[k]!==cc)k++;soon.set(cc,k);}}
    mv.sort((a,b)=>soon.get(G.buses[a].color)-soon.get(G.buses[b].color));

function hint(){

    if(b){b[1]--;i++;if(!b[1])parked.splice(parked.indexOf(b),1);}
    else if(next<E.length&&parked.length<G.slots){parked.push([E[next].color,E[next].cap]);next++;}

function win(){

  if(G.end==="demo"){show("お手本おわり","<p>この順番でバスを出すと全員乗れる。</p>",[["自分でやってみる",()=>load(G.L),true],["とばして次へ",skip,false]]);return;}
  if(G.end==="win"){const r=G.res;
    show(nm(G.L)+" クリア",'<p class="stars" aria-label="星'+stars(r.used)+'つ">'+starStr(stars(r.used))+"</p><p>タイム <b>"+mmss(r.sec)+"</b>　もどす・ヒント <b>"+r.used+"</b> 回"+(r.better?"<br>自己ベスト更新":"")+"</p>",
      [[nm(G.L+1)+" へ",()=>load(G.L+1),true],["もう一度このレベル",()=>load(G.L),false]]);
  }else{
    show("のりばが満車","<p>先頭の"+COLORS[G.queue[G.qi]].n+"の人が乗れるバスが、のりばに1台もない。</p>",
      (G.undos>0?[["1手もどす（のこり"+G.undos+"回）",undo,true]]:[]).concat([["最初からやり直す",()=>load(G.L),G.undos<=0],["お手本を見る",demo,false]]));
  }
}
function closeDlg(){if(G&&G.end)endDialog();else dialogEl.hidden=true;}
function howto(){
  show("あそびかた","<ol><li>下の駐車場で、<b>矢印の先があいているバス</b>をタップ</li><li>バスが「のりば」に停まる</li><li>列の先頭から、<b>同じ色の人</b>が乗る。満員になったら発車</li></ol><p>のりばが全部うまって、先頭の人が乗れなくなったら負け。ちがう色のバスは、その色の人が先頭に来るまでのりばをふさぐ。バスの数字は乗れる人数。</p><p>こまったら「ヒント」で次に出すバスが光る（★がひとつ減る）。「メニュー」からお手本ととばすが選べる。</p>",
    [["はじめる",()=>{autoHelp=false;if(!S.help){S.help=true;save();}closeDlg();},true]]);
}
function records(){
  const base=0,mx=S.max,N=Math.max(LEVELS.length+DENSE.length,Math.ceil(mx/5)*5);
  let done=0,st=0,t="";
  for(let i=1;i<=N;i++){
    const L=base+i,r=S.rec[L],skipped=!r&&S.sk.includes(L),cleared=!!r||(i<mx&&!skipped),open=i<=mx;
    if(cleared)done++;if(r)st+=stars(r[1]);
    t+='<button type="button" class="tile'+(cleared?" done":"")+(L===G.L?" here":"")+'" data-l="'+L+'"'+(open?"":" disabled")+
      ' aria-label="'+nm(L)+(cleared?" クリア済み":skipped?" スキップ":open?" 挑戦中":" まだ遊べない")+'"><b>'+i+"</b><span>"+
      (r?starStr(stars(r[1])):skipped?"スキップ":cleared?"クリア":open?"挑戦中":"－")+"</span><small>"+(r&&r[2]?mmss(r[2]):"")+"</small></button>";
  }
  show("きろく","<p>クリア <b>"+done+"</b> 面　★ <b>"+st+'</b></p><div class="tiles">'+t+'</div><p class="note">'+
    (cloudOn?"セーブ先：このページ（Claude側に保存。閉じても残る）":"セーブ先：このブラウザの中")+"</p>",[["とじる",closeDlg,true]],"wide");
  const box=dialogEl.querySelector(".tiles"),here=box.querySelector(".here");
  box.addEventListener("click",e=>{const b=e.target.closest(".tile");if(b&&!b.disabled)load(+b.dataset.l);});
  if(here)box.scrollTop=Math.max(0,here.offsetTop-90);
}
function show(title,html,acts,cls){
  dialogEl.innerHTML='<div class="card'+(cls?" "+cls:"")+'" role="dialog" aria-label="'+title+'"><h2>'+title+"</h2>"+html+'<div class="acts"></div></div>';
  const boxEl=dialogEl.querySelector(".acts");
  acts.forEach(a=>{const b=document.createElement("button");b.type="button";b.className="btn"+(a[2]?" go":"");b.textContent=a[0];b.addEventListener("click",a[1]);boxEl.appendChild(b);});
  dialogEl.hidden=false;
  const f=boxEl.querySelector("button");if(f)f.focus({preventScroll:true});
}
function undo(){
  if(G.demo||!G.hist.length||G.undos<=0)return;
  G.hintId=-1;
  const s=G.hist.pop();
  G.undos--;G.used++;G.over=false;G.end=null;G.stuckT=0;dialogEl.hidden=true;
  G.qi=s.qi;G.qv=s.qi;G.seq=s.seq;G.bay=s.bay;G.walkers=[];
  G.buses.forEach((b,i)=>{b.state=s.b[i][0];b.slot=s.b[i][1];b.rem=s.b[i][2];b.order=s.b[i][3];b.t=0;b.d=0;b.flash=0;});
  say("1手もどした");SFX.undo();
}

/* ---------- drawing ---------- */
function readTheme(){const cs=getComputedStyle(document.documentElement);
  for(const k of["panel","track","road","slot","lot","ink","muted"])TH[k]=cs.getPropertyValue("--"+k).trim();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBus(x,y,a,len,w,col,label,flash,scale,cap){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);if(scale)ctx.scale(scale,scale);
  ctx.fillStyle="rgba(0,0,0,.28)";rr(-len/2+1.5,-w/2+2.5,len,w,6);ctx.fill();
  ctx.fillStyle=col.c;rr(-len/2,-w/2,len,w,6);ctx.fill();
  ctx.lineWidth=1.6;ctx.strokeStyle=col.d;ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.6)";rr(len/2-9,-w/2+3.5,5,w-7,2);ctx.fill();
  
  if(label==null){
    const L=len,k=w/24,s1=2.3*k,s2=6.2*k;ctx.beginPath();ctx.moveTo(-.2*L,-s1);ctx.lineTo(.06*L,-s1);ctx.lineTo(.06*L,-s2);ctx.lineTo(.26*L,0);
    ctx.lineTo(.06*L,s2);ctx.lineTo(.06*L,s1);ctx.lineTo(-.2*L,s1);ctx.closePath();
    ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=col.d;ctx.stroke();
  }
  if(flash>0){ctx.fillStyle="rgba(255,255,255,"+(.6*flash/340)+")";rr(-len/2,-w/2,len,w,6);ctx.fill();}
  ctx.restore();
  if(cap){
    const k=w/24,cx=x-Math.cos(a)*(len/2-10*k),cy=y-Math.sin(a)*(len/2-10*k);
    ctx.font="800 "+Math.max(7,Math.round(10*k))+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=2.5;ctx.strokeStyle=col.d;ctx.strokeText(cap,cx,cy+.5);ctx.fillStyle="#fff";ctx.fillText(cap,cx,cy+.5);
  }
  if(label!=null){
    ctx.font="800 15px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=3.5;ctx.strokeStyle=col.d;ctx.strokeText(label,x,y+3);ctx.fillStyle="#fff";ctx.fillText(label,x,y+3);
  }
}
function pawn(x,y,col,s){
  if(s&&s!==1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);pawn(0,0,col);ctx.restore();return;}
  ctx.fillStyle=col.c;ctx.strokeStyle=col.d;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x-5.2,y);ctx.quadraticCurveTo(x-5.6,y-9.5,x,y-9.5);ctx.quadraticCurveTo(x+5.6,y-9.5,x+5.2,y);
  ctx.quadraticCurveTo(x,y+2.2,x-5.2,y);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x,y-13,4.3,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.45)";ctx.beginPath();ctx.arc(x-1.3,y-14.300,1.4,0,7);ctx.fill();
}
let FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif';
const ease=t=>1-(1-t)*(1-t);
function draw(now){
  ctx.setTransform(sc,0,0,sc,0,0);ctx.clearRect(0,0,W,H);
  // people zone
  ctx.fillStyle=TH.panel;rr(0,0,W,QH-6,12);ctx.fill();
  const P=G.path;
  ctx.strokeStyle=TH.track;ctx.lineWidth=P.A*LW+9;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
  for(let i=0;i<P.pts.length&&P.cum[i]<=P.show;i++){const p=P.pts[i];if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);}
  ctx.stroke();
  const ppl=[];
  const vis=Math.floor((P.len-4)/SP)*P.A,end=Math.min(G.queue.length,G.qi+vis);
  const ps=P.A>=3?.8:1;let head=null;     // a big crowd gets slightly smaller people so colours don't run together
  for(let k=G.qi;k<end;k++){
    const p=posAt(P,(k-G.qv)/P.A*SP),off=((k%P.A)-(P.A-1)/2)*LW,e=[p.x+p.nx*off,p.y+p.ny*off,G.queue[k]];
    if(k===G.qi)head=e;else ppl.push(e);
  }
  ppl.sort((a,b)=>a[1]-b[1]);
  for(const p of ppl)pawn(p[0],p[1],COLORS[p[2]],ps);
  if(head){   // the front person: drawn last, on a light disc with a dark ring
    ctx.fillStyle=TH.panel;ctx.strokeStyle=TH.ink;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(head[0],head[1]-7*ps,8*ps+3,11*ps+3,0,0,7);ctx.fill();ctx.stroke();
    pawn(head[0],head[1],COLORS[head[2]],ps);
  }
  if(G.queue.length>end){
    const t="ほか "+(G.queue.length-end)+"人",lx=GATE.x,ly=G.ring?84:posAt(P,P.len-2).y-14;
    ctx.font="800 11px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";const tw=ctx.measureText(t).width+14;
    ctx.fillStyle=TH.ink;rr(lx-tw/2,ly-9,tw,18,9);ctx.fill();ctx.fillStyle=TH.panel;ctx.fillText(t,lx,ly+.5);
  }
  if(G.qi<G.queue.length){   // "next" strip: the front person big, then the following six in order
    const x0=226,y0=152,pw=130,ph=20;
    ctx.fillStyle=TH.lot;rr(x0,y0,pw,ph,10);ctx.fill();
    ctx.font="800 10px "+FONT;ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle=TH.ink;ctx.fillText("つぎ",x0+8,y0+ph/2+.5);
    pawn(x0+38,y0+ph-1.5,COLORS[G.queue[G.qi]],1);
    for(let i=1;i<=6&&G.qi+i<G.queue.length;i++)pawn(x0+42+i*13,y0+ph-3,COLORS[G.queue[G.qi+i]],.62);
  }
  // bus stop bays
  ctx.fillStyle=TH.road;rr(0,RY,W,RH,12);ctx.fill();
  ctx.save();rr(0,RY,W,RH,12);ctx.clip();
  ctx.strokeStyle=TH.slot;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
  for(let i=0;i<G.slots;i++){rr(slotX(i)-SW/2,RY+8,SW,RH-16,8);ctx.stroke();}
  ctx.setLineDash([]);
  for(const b of G.buses){
    if(b.slot<0)continue;const x=slotX(b.slot),col=COLORS[b.color];
    if(b.state==="arrive")drawBus(x,slotY+(1-ease(b.t))*RH,-Math.PI/2,pl(b),24,col,b.rem,0,PARK);
    else if(b.state==="parked"||b.state==="full")drawBus(x,slotY,-Math.PI/2,pl(b),24,col,b.rem,0,PARK);
    else if(b.state==="leave")drawBus(x,slotY-b.t*b.t*(RH+30),-Math.PI/2,pl(b),24,col,null,0,PARK);
  }
  ctx.restore();
  for(const w of G.walkers){const t=ease(w.t);pawn(GATE.x+(w.x-GATE.x)*t,GATE.y+(w.y+8-GATE.y)*t,COLORS[w.c],G.path.A>=3?.8:1);}
  // parking lot
  ctx.fillStyle=TH.lot;rr(LOT.x-8,LOT.y-8,LOT.w+16,LOT.h+16,12);ctx.fill();
  ctx.save();rr(LOT.x-8,LOT.y-8,LOT.w+16,LOT.h+16,12);ctx.clip();
  if(G.mask)ctx.drawImage(G.mask,LOT.x-8,LOT.y-8,LOT.w+16,LOT.h+16);
  for(const b of G.buses){
    let d=0;
    if(b.state==="bump")d=b.dmax*Math.sin(Math.PI*b.t);
    else if(b.state==="exit")d=b.d;
    else if(b.state!=="lot")continue;
    drawBus(b.x+Math.cos(b.a)*d,b.y+Math.sin(b.a)*d,b.a,b.len,b.w,COLORS[b.color],null,b.flash,0,b.cap);
  }
  const hb=G.hintId>=0?G.buses[G.hintId]:null;
  if(hb&&(hb.state==="lot"||hb.state==="bump")){
    const pulse=.5+.5*Math.sin(now/160);
    ctx.save();ctx.translate(hb.x,hb.y);ctx.rotate(hb.a);
    ctx.strokeStyle="rgba(255,255,255,"+(.6+.4*pulse)+")";ctx.lineWidth=3.5;
    rr(-hb.len/2-4-pulse*3,-hb.w/2-4-pulse*3,hb.len+8+pulse*6,hb.w+8+pulse*6,10);ctx.stroke();ctx.restore();
    const lbl=G.demo?"おてほん":"ここ！",lw=G.demo?54:40,ly=hb.y-hb.len/2-14<LOT.y+8?hb.y+hb.len/2+14:hb.y-hb.len/2-14;
    ctx.font="800 11px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=TH.ink;rr(hb.x-lw/2,ly-9,lw,18,9);ctx.fill();ctx.fillStyle=TH.panel;ctx.fillText(lbl,hb.x,ly+.5);
  }
  ctx.restore();
}

/* ---------- wiring ---------- */
function fit(){const cw=cv.clientWidth||360,dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(cw*H/W*dpr);sc=cv.width/W;}
cv.addEventListener("pointerdown",e=>{
  if(!G||G.over||G.demo)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  let hit=null,hd=1e9;
  for(const b of G.buses){ if(b.state!=="lot")continue;
    const dx=x-b.x,dy=y-b.y,c=Math.cos(b.a),s=Math.sin(b.a),lx=dx*c+dy*s,ly=-dx*s+dy*c;
    if(Math.abs(lx)<=b.len/2+4&&Math.abs(ly)<=b.w/2+4){const d=dx*dx+dy*dy;if(d<hd){hd=d;hit=b;}}}
  if(hit)tapBus(hit);
});
$("undo").addEventListener("click",undo);
$("retry").addEventListener("click",()=>load(G.L));
$("hint").addEventListener("click",hint);
$("menu").addEventListener("click",menu);
$("snd").addEventListener("click",()=>{S.snd=!S.snd;sndUI();save();if(S.snd)SFX.depart();});
$("prev").addEventListener("click",()=>{if(G.L>1)load(G.L-1);});
$("next").addEventListener("click",()=>{if(G.L<modeMax(G.L))load(G.L+1);});
window.addEventListener("resize",fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTheme);
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

let last=0;
function frame(now){
  const dt=Math.min(50,now-(last||now));last=now;
  if(G){update(dt);draw(now);}
  requestAnimationFrame(frame);
}
function start(d){
  S=readLocal();sndUI();
  readTheme();fit();
  load(Math.min((d&&d.level)||S.cur||1,S.max));
  if(!S.help){autoHelp=true;howto();}
  requestAnimationFrame(frame);
  initCloud();
}
window.__busnoriba={hint,demo,skip,solveFrom,get audio(){return AC?AC.state:"none"},get G(){return G},get S(){return S},get cloudOn(){return cloudOn},load,tap:id=>tapBus(G.buses[id]),speed:v=>{TS=v;}};
try{window.claude?.hot?.snapshot?.(()=>({level:G?G.L:1}));}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
})();
</script>
